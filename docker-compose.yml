services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ignite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ignite_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ignite}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ignite} -d ${POSTGRES_DB:-ignite}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
