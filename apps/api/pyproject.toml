[project]
name = "ignite-api"
version = "0.1.0"
description = "Ignite RAG v1 — FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. as call defaults is the idiomatic pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.pytest.ini_options]
pythonpath = ["."]
