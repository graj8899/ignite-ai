name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version-file: apps/api/.python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -rs

  api-integration:
    name: api (migrations + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      # Obviously fake values — no real secrets are needed for CI.
      OPENAI_API_KEY: ci-dummy-key
      OPENAI_MODEL: ci-dummy-model
      EMBEDDING_MODEL: ci-dummy-embedding-model
      AUTH_SECRET: ci-dummy-secret
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      # An unreachable DB in this job means something is broken (there's a
      # service container), so fail instead of silently skipping.
      REQUIRE_DB: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version-file: apps/api/.python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Run migrations (upgrade)
        run: uv run alembic upgrade head

      - name: Downgrade then re-upgrade (proves downgrade() works)
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest -m integration -rs
